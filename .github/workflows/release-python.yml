name: Release statelet (PyPI)

# Publishes the pure-Python client. Server binaries are NOT part of this package
# — they ship from the engine repository.
#
# Authentication is PyPI trusted publishing: no API token is stored here. Before
# the first release, add a pending publisher at
# https://pypi.org/manage/account/publishing/ with
#   project: statelet · owner: stateletlab · repo: statelet-sdk
#   workflow: release-python.yml · environment: pypi

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          PKG_VERSION="$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi
          echo "releasing statelet $PKG_VERSION"

      - name: Build
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: statelet-dist
          path: python/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: statelet-dist
          path: dist

      - run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

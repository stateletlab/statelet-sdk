name: Release SDKs

# One workflow for all six client SDKs. They ship to six unrelated places, so
# what is shared here is the trigger, the version check, and the proto-sync gate
# — not the publishing mechanics, which have nothing in common:
#
#   python   statelet-sdk                             -> PyPI          (OIDC, no token)
#   nodejs   statelet-sdk                             -> npm           (OIDC, no token)
#   rust     statelet-sdk                             -> crates.io     (CARGO_REGISTRY_TOKEN)
#   java     ai.statelet:statelet-sdk                 -> Maven Central (portal token + GPG)
#   go       github.com/stateletlab/statelet-sdk/go   -> the tag itself; there is no registry
#   cpp      source tarball                           -> GitHub Release; there is no registry
#
# There are two ways in, and the difference is which one owns the version.
#
# 1. Actions -> Run workflow, with `sdks` and `version`. The version is written
#    into every selected manifest, committed, and only then built — so one
#    field sets all six and no manifest is edited by hand. Leaving `version`
#    empty releases whatever the manifests already say.
#
# 2. Push a tag. Here the manifest is already the source of truth and the tag
#    only has to agree with it; a mismatch fails before anything is uploaded.
#
#      git tag python-v0.1.1 && git push origin python-v0.1.1
#      git tag go/v0.1.0     && git push origin go/v0.1.0   # go/ prefix required
#
# Versions stay per-SDK either way: `sdks` decides who moves, so releasing two
# at one version and leaving the rest behind is the normal case, not a
# workaround. dry_run defaults to on.
#
# The bump commit is pushed with GITHUB_TOKEN, which by design raises no events
# — that is what stops this workflow retriggering itself on its own commit, and
# it also means CI does not run on that commit. The release jobs build and test
# it directly, so it is not shipped unverified, but the commit will show no
# check marks on the branch.
#
# Secrets and one-time setup are listed under "Publishing credentials" in
# CONTRIBUTING.md. langchain-statelet is NOT here — it is an integration
# package, not an SDK, and keeps its own release-langchain.yml.

on:
  workflow_dispatch:
    inputs:
      sdks:
        description: 'Which SDKs: "all", or a comma-separated subset of python,nodejs,rust,go,java,cpp'
        type: string
        default: all
      dry_run:
        description: 'Build, test and verify, but do not publish anything'
        type: boolean
        default: true
      version:
        description: 'Version to release, e.g. 0.2.0. Written into every selected SDK''s manifest and committed before anything is built. Leave empty to release whatever the manifests already say.'
        type: string
        default: ''
  push:
    tags:
      - 'python-v*'
      - 'nodejs-v*'
      - 'rust-v*'
      - 'java-v*'
      - 'cpp-v*'
      - 'go/v*'

permissions:
  contents: read

# Two releases of the same SDK must not interleave, but python and rust
# releasing at once is fine and common — hence a per-ref group. Never cancel:
# half a publish is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      nodejs: ${{ steps.select.outputs.nodejs }}
      rust: ${{ steps.select.outputs.rust }}
      go: ${{ steps.select.outputs.go }}
      java: ${{ steps.select.outputs.java }}
      cpp: ${{ steps.select.outputs.cpp }}
      version: ${{ steps.select.outputs.version }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      sha: ${{ steps.sha.outputs.sha }}
    permissions:
      contents: write   # to commit the version bump
    steps:
      - uses: actions/checkout@v4

      # Every published artifact carries its own vendored copy of the proto, so
      # a stale copy is not a lint failure — it ships wrong bytes to users of
      # that one language. Gate the whole release on it.
      - name: proto copies in sync
        run: ./scripts/sync-proto.sh --check

      - name: Decide what is being released
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT_SDKS: ${{ inputs.sdks }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"

          if [ "$EVENT" = "push" ]; then
            dry_run=false
            case "$REF" in
              python-v*) selected=python; version="${REF#python-v}" ;;
              nodejs-v*) selected=nodejs; version="${REF#nodejs-v}" ;;
              rust-v*)   selected=rust;   version="${REF#rust-v}"   ;;
              java-v*)   selected=java;   version="${REF#java-v}"   ;;
              cpp-v*)    selected=cpp;    version="${REF#cpp-v}"    ;;
              go/v*)     selected=go;     version="${REF#go/v}"     ;;
              *) echo "::error::$REF is not a release tag this workflow knows" >&2; exit 1 ;;
            esac
          else
            dry_run="$INPUT_DRY"
            selected="${INPUT_SDKS// /}"
            [ "$selected" = "all" ] && selected="python,nodejs,rust,go,java,cpp"
          fi

          for sdk in python nodejs rust go java cpp; do
            case ",$selected," in
              *",$sdk,"*) echo "$sdk=true"  >> "$GITHUB_OUTPUT" ;;
              *)          echo "$sdk=false" >> "$GITHUB_OUTPUT" ;;
            esac
          done
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run"   >> "$GITHUB_OUTPUT"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| SDKs | \`$selected\` |"
            echo "| Version | ${version:-_taken from each manifest_} |"
            echo "| Publish | $([ "$dry_run" = "true" ] && echo 'no — dry run' || echo '**yes**') |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT" != "push" ] && [ "$dry_run" != "true" ] && [ -z "$version" ]; then
            echo "::warning::No version given, so this publishes whatever the manifests currently say and nothing cross-checks them."
          fi

      # The version has to be committed, not just written: an artifact built
      # from an uncommitted edit corresponds to no revision anyone can check
      # out, so `git checkout <tag>` would rebuild a different version than the
      # one on the registry. Everything downstream is then pinned to the commit
      # this makes, which is why plan exports a sha at all.
      #
      # A tag push never gets here. There the manifest is already the source of
      # truth and the per-job check enforces that the tag agrees with it.
      - name: Apply the version to every selected manifest
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && steps.select.outputs.dry_run != 'true'
        env:
          VERSION: ${{ inputs.version }}
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          set -euo pipefail
          IFS=, read -ra sdks <<< "$SELECTED"
          for sdk in "${sdks[@]}"; do
            ./scripts/set-sdk-version.sh "$sdk" "$VERSION"
          done

          if git diff --quiet; then
            echo "manifests already at $VERSION; nothing to commit"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -aqm "release: $SELECTED $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "committed $VERSION to $GITHUB_REF_NAME"

      - name: Rehearse the version change
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && steps.select.outputs.dry_run == 'true'
        env:
          VERSION: ${{ inputs.version }}
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          set -euo pipefail
          IFS=, read -ra sdks <<< "$SELECTED"
          for sdk in "${sdks[@]}"; do
            ./scripts/set-sdk-version.sh "$sdk" "$VERSION"
          done
          echo "::notice::Dry run: the manifests above were rewritten in the runner and thrown away. Nothing was committed, and the jobs below build the versions currently on $GITHUB_REF_NAME."
          git checkout -- .

      - name: Resolve the commit everything else builds from
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── python -> PyPI ──────────────────────────────────────────────────────────
  # Trusted publishing: no API token lives in this repository. The pending
  # publisher at https://pypi.org/manage/account/publishing/ must name
  #   project: statelet-sdk · owner: stateletlab · repo: statelet-sdk
  #   workflow: release.yml · environment: pypi
  # NOTE: `release.yml`, not the `release-python.yml` this replaced. A trusted
  # publisher is keyed on the workflow FILENAME, so the PyPI entry has to be
  # edited or the first publish is rejected as an untrusted claim.
  python:
    name: python -> PyPI
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: ./scripts/sdk-version.sh python '${{ needs.plan.outputs.version }}'

      - name: Build
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: statelet-dist
          path: python/dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: needs.plan.outputs.dry_run != 'true'
        with:
          packages-dir: python/dist/

  # ── nodejs -> npm ───────────────────────────────────────────────────────────
  nodejs:
    name: nodejs -> npm
    needs: plan
    if: needs.plan.outputs.nodejs == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # provenance attestation; not authentication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # Node 22 and npm >= 11.5.1 are hard floors for trusted publishing: older
      # CLIs have no OIDC exchange and fall back to looking for a token that is
      # deliberately no longer here. Node 22 ships npm 10, hence the upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: ./scripts/sdk-version.sh nodejs '${{ needs.plan.outputs.version }}'

      - name: Install
        working-directory: nodejs
        run: npm ci

      - name: Test
        working-directory: nodejs
        run: npm test

      # client.ts resolves the proto relative to the package root, so a tarball
      # without it installs clean and then throws on first connect. CI checks
      # this too; it is repeated here because this is the copy that ships.
      - name: Verify the packed tarball carries the proto
        working-directory: nodejs
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if ! grep -q '"path": *"proto/statelet.proto"' /tmp/pack.json; then
            echo "::error::proto/statelet.proto is missing from the npm tarball" >&2
            cat /tmp/pack.json >&2
            exit 1
          fi

      # No token. npm's trusted publisher for statelet-sdk names this repository,
      # this workflow FILENAME and the `npm` environment, and the OIDC token
      # minted for this job carries exactly those claims. Provenance is signed
      # off the same id-token, so --provenance costs nothing extra here.
      #
      # Trusted publishing cannot perform a package's FIRST publish — npm has no
      # equivalent of PyPI's pending publishers, so the publisher can only be
      # attached to a package that already exists. statelet-sdk@0.1.0 was pushed
      # by hand to get past that; every release from 0.1.1 on runs here.
      - name: Publish
        if: needs.plan.outputs.dry_run != 'true'
        working-directory: nodejs
        run: npm publish --provenance --access public

  # ── rust -> crates.io ───────────────────────────────────────────────────────
  rust:
    name: rust -> crates.io
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: ./scripts/sdk-version.sh rust '${{ needs.plan.outputs.version }}'

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test

      # build.rs compiles the vendored proto, so `cargo package` compiling the
      # packaged crate from scratch is the only real check that `include` is
      # complete. Do it before publish, which cannot be undone.
      - name: Verify the crate packages standalone
        working-directory: rust
        run: cargo package

      - name: Publish
        if: needs.plan.outputs.dry_run != 'true'
        working-directory: rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── java -> Maven Central ───────────────────────────────────────────────────
  # Needs, one time: the ai.statelet namespace verified in the Central Portal, a
  # published GPG key, and four secrets — MAVEN_CENTRAL_USERNAME /
  # MAVEN_CENTRAL_PASSWORD (portal tokens, not the account password),
  # MAVEN_GPG_PRIVATE_KEY (ASCII-armoured) and MAVEN_GPG_PASSPHRASE.
  java:
    name: java -> Maven Central
    needs: plan
    if: needs.plan.outputs.java == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - run: ./scripts/sdk-version.sh java '${{ needs.plan.outputs.version }}'

      - name: Test
        run: mvn --batch-mode test
        working-directory: java

      # Unsigned on a dry run: the signing key is the one input a rehearsal has
      # no business needing, and gpg.skip leaves everything else identical.
      - name: Build the release artifacts (unsigned)
        if: needs.plan.outputs.dry_run == 'true'
        working-directory: java
        run: mvn --batch-mode -P release verify -Dgpg.skip=true

      - name: Import the signing key
        if: needs.plan.outputs.dry_run != 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish
        if: needs.plan.outputs.dry_run != 'true'
        working-directory: java
        run: mvn --batch-mode -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  # ── go -> the module proxy ──────────────────────────────────────────────────
  # Go has no registry and no publish step: the `go/vX.Y.Z` tag IS the release,
  # and it is already pushed by the time this job runs. All this job can do is
  # verify the tagged tree is sound and ask the proxy to fetch it, so the first
  # real user is not the one who discovers a broken tag.
  go:
    name: go -> module proxy
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Check the module path
        working-directory: go
        run: |
          set -euo pipefail
          want='github.com/stateletlab/statelet-sdk/go'
          have="$(go list -m)"
          if [ "$have" != "$want" ]; then
            echo "::error::go.mod declares $have, but the go/vX.Y.Z tag on this repository publishes $want" >&2
            exit 1
          fi
          echo "module $have"

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

      - name: Warm the module proxy
        if: needs.plan.outputs.dry_run != 'true' && github.event_name == 'push'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mod='github.com/stateletlab/statelet-sdk/go'
          cd "$(mktemp -d)"
          go mod init warm >/dev/null
          # The proxy discovers a tag on its own schedule, so the first few
          # attempts legitimately 404. This is a convenience, not a gate.
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go get "$mod@v$VERSION"; then
              echo "proxy is serving $mod@v$VERSION"
              exit 0
            fi
            echo "attempt $attempt: not on the proxy yet"
            sleep 30
          done
          echo "::warning::proxy.golang.org has not picked up $mod@v$VERSION yet. The tag is pushed, so it will resolve on its own; nothing is broken."

      # The version input is optional for the other five, which fall back to
      # what their manifests already say. Go has no such fallback: there is no
      # field anywhere in a Go module that records its own version, so with the
      # input empty there is simply nothing to name a tag after.
      - name: Require a version when releasing Go from a dispatch
        if: github.event_name != 'push' && needs.plan.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::Releasing Go needs the version input. A Go module declares no version anywhere in its tree — the go/vX.Y.Z tag IS the version — so unlike the other five SDKs there is no manifest to fall back to." >&2
            exit 1
          fi
          echo "will be tagged go/v$VERSION by the tag job"

  # ── cpp -> GitHub Release tarball ───────────────────────────────────────────
  # No package registry to target. Consumers vendor the tree or point
  # FetchContent at a tarball, so the release artifact is a self-contained
  # source archive: the CMake project plus its vendored proto and the licences.
  cpp:
    name: cpp -> release tarball
    needs: plan
    if: needs.plan.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaching an asset to the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Install gRPC and Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev

      - name: Resolve the version
        id: v
        run: echo "version=$(./scripts/sdk-version.sh cpp '${{ needs.plan.outputs.version }}')" >> "$GITHUB_OUTPUT"

      - name: Configure
        working-directory: cpp
        run: cmake -B build

      - name: Build
        working-directory: cpp
        run: cmake --build build

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build --output-on-failure

      # Assembled by hand rather than `git archive`, because the archive has to
      # be rooted at the CMake project while still carrying the repository-level
      # LICENSE and NOTICE, and has to exclude the build tree.
      - name: Assemble the source tarball
        id: pack
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          stage="statelet-cpp-$VERSION"
          mkdir "$stage"
          cp -R cpp/CMakeLists.txt cpp/include cpp/src cpp/proto cpp/examples cpp/tests cpp/README.md "$stage/"
          cp LICENSE NOTICE "$stage/"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          cat "$stage.tar.gz.sha256"
          echo "tarball=$stage.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: statelet-cpp-source
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256

      - name: Attach to the GitHub Release
        if: needs.plan.outputs.dry_run != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "C++ SDK ${{ steps.v.outputs.version }}" \
              --notes "Self-contained CMake source tree for the Statelet C++ client. Verify with the accompanying .sha256."
          fi
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber

  # ── tag what was just released ──────────────────────────────────────────────
  # A tag push is still the primary trigger and this job does nothing for it.
  # It exists for the dispatch path, which had no tag and therefore left two
  # holes: Go and C++ are released BY their tag, so neither could be shipped
  # that way at all, and the other four could be published with no ref anyone
  # could later point at and say "that is what 0.1.1 was built from".
  #
  # Tags are created after the publish jobs, not before, so a tag never claims a
  # release that failed halfway. Go is the exception in spirit — its tag IS the
  # release — but the ordering still holds: the go job verifies the tree, then
  # this job tags it and warms the proxy.
  #
  # Pushing with GITHUB_TOKEN does NOT re-trigger this workflow, even though
  # `on.push.tags` matches what is created here: GitHub deliberately suppresses
  # workflow runs from events raised by the default token, which is what keeps
  # this from looping.
  tag:
    name: tag the release
    needs: [plan, python, nodejs, rust, go, java, cpp]
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && needs.plan.result == 'success'
      && needs.plan.outputs.dry_run != 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Create and push the tags
        env:
          SEL_PYTHON: ${{ needs.plan.outputs.python }}
          SEL_NODEJS: ${{ needs.plan.outputs.nodejs }}
          SEL_RUST: ${{ needs.plan.outputs.rust }}
          SEL_GO: ${{ needs.plan.outputs.go }}
          SEL_JAVA: ${{ needs.plan.outputs.java }}
          SEL_CPP: ${{ needs.plan.outputs.cpp }}
          GO_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tagged=()
          for sdk in python nodejs rust go java cpp; do
            eval "selected=\${SEL_$(echo "$sdk" | tr '[:lower:]' '[:upper:]')}"
            [ "$selected" = 'true' ] || continue

            if [ "$sdk" = 'go' ]; then
              # No manifest to read; the go job already refused to get this far
              # with an empty version.
              version="$GO_VERSION"
              tag="go/v$version"
            else
              # Read from the manifest rather than trusting the input: the
              # checkout is pinned to the commit plan produced, so this is the
              # version that was actually built, whether plan wrote it or it was
              # already there.
              version="$(./scripts/sdk-version.sh "$sdk")"
              tag="$sdk-v$version"
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::warning::$tag already exists on the remote; leaving it alone. The publish jobs still ran, so this is a re-release of a version that was already tagged."
              continue
            fi

            git tag -a "$tag" -m "$sdk SDK $version" "$GITHUB_SHA"
            git push origin "$tag"
            echo "pushed $tag"
            tagged+=("$tag")
          done

          {
            echo "### Tags"
            echo
            if [ ${#tagged[@]} -eq 0 ]; then
              echo "_none created — every selected SDK was already tagged at its current version._"
            else
              printf -- '- \`%s\`\n' "${tagged[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only reachable on the dispatch path; the push path warms the proxy in
      # the go job, where the tag already exists on arrival.
      - name: Warm the module proxy
        if: needs.plan.outputs.go == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mod='github.com/stateletlab/statelet-sdk/go'
          cd "$(mktemp -d)"
          go mod init warm >/dev/null
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go get "$mod@v$VERSION"; then
              echo "proxy is serving $mod@v$VERSION"
              exit 0
            fi
            echo "attempt $attempt: not on the proxy yet"
            sleep 30
          done
          echo "::warning::proxy.golang.org has not picked up $mod@v$VERSION yet. The tag is pushed, so it will resolve on its own; nothing is broken."

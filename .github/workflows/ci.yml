name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto-sync:
    name: proto copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync-proto.sh --check

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: python
        run: pytest tests/ -v
      - name: Build wheel
        working-directory: python
        run: |
          pip install build
          python -m build
      - name: Check metadata
        working-directory: python
        run: |
          pip install twine
          twine check dist/*

  langchain:
    name: langchain-statelet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: python/langchain-statelet
        run: |
          pip install -e ../
          pip install -e ".[dev]"
      - name: Lint
        working-directory: python/langchain-statelet
        run: |
          ruff check langchain_statelet/
          ruff format --check langchain_statelet/

  nodejs:
    name: nodejs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: nodejs
        run: npm ci
      - name: Test
        working-directory: nodejs
        run: npm test
      - name: Verify the packed tarball carries the proto
        working-directory: nodejs
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if ! grep -q '"path": *"proto/statelet.proto"' /tmp/pack.json; then
            echo "::error::proto/statelet.proto is missing from the npm tarball" >&2
            cat /tmp/pack.json >&2
            exit 1
          fi

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test
        working-directory: go
        run: go test ./...

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test
      - name: Verify the crate packages standalone
        working-directory: rust
        run: cargo package --allow-dirty

  # EXPECTED RED. The engine's proto declares an enum `condition` alongside
  # `bytes condition_value`, and protoc-gen-java emits getConditionValue() for
  # both, so the generated sources do not compile. This job stays enabled so the
  # breakage is visible; see "Known issues" in CHANGELOG.md. Fix is a field
  # rename in the engine repository, which owns the contract.
  java:
    name: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Test
        working-directory: java
        run: mvn --batch-mode test

  cpp:
    name: cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gRPC and Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev
      - name: Configure
        working-directory: cpp
        run: cmake -B build
      - name: Build
        working-directory: cpp
        run: cmake --build build
      - name: Test
        working-directory: cpp
        run: ctest --test-dir build --output-on-failure

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-statelet"
version = "0.1.0"
description = "LangChain integration for Statelet — VectorStore, ChatHistory, and GraphStore backed by a single self-hosted engine."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Statelet"}]
keywords = ["langchain", "statelet", "vector-store", "graph-store", "chat-history", "ai-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "statelet-sdk>=0.1.1",
    "langchain-core>=0.2",
]

[project.optional-dependencies]
graph = ["langchain-community>=0.2"]
dev = [
    "pytest>=7",
    "ruff>=0.16,<0.17",
    "langchain-community>=0.2",
]

[project.urls]
Homepage = "https://github.com/stateletlab/statelet-sdk"
Repository = "https://github.com/stateletlab/statelet-sdk"
Issues = "https://github.com/stateletlab/statelet-sdk/issues"
Documentation = "https://statelet.ai"

[tool.ruff]
target-version = "py39"
line-length = 100

# Selected explicitly. Ruff's implicit default set widens between releases, so
# leaving this out means the lint gate changes under us on an unrelated ruff
# upgrade — which is exactly how this package ended up with 66 findings on a
# release workflow that had never actually run. These are pyflakes + the error
# subset of pycodestyle + import ordering.
#
# Deliberately not enabled: UP0xx (pep585/pep604 modernization) would rewrite
# annotations this package still supports on Python 3.9, and S110/BLE001 flag
# real but intentional broad-except paths that need a behavior decision rather
# than a mechanical fix.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statelet-sdk"
version = "0.1.1"
description = "Python SDK for Statelet — agent memory with KV, vector search, and temporal causal graphs in one database"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["statelet", "agent", "memory", "vector", "graph", "database", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.60", "pytest>=7"]

[project.urls]
Homepage = "https://statelet.com"
Repository = "https://github.com/stateletlab/statelet-sdk"
Issues = "https://github.com/stateletlab/statelet-sdk/issues"

# Listed explicitly rather than auto-discovered: this directory also holds the
# `langchain-statelet/` companion package, and flat-layout auto-discovery would
# otherwise try to claim it.
[tool.setuptools]
packages = ["statelet"]
